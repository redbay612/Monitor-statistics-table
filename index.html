<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監視器巡檢報告系統 V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ExcelJS: 產生含圖片的 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <!-- FileSaver: 下載檔案 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- jsPDF: 產生 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .preview-img { max-width: 150px; max-height: 100px; object-fit: cover; border-radius: 4px; }
        .drop-area { border: 2px dashed #cbd5e1; transition: all 0.2s; height: 160px; cursor: pointer; }
        .drop-area:hover { border-color: #4f46e5; background: #f8fafc; }
        .drop-area.active { border-color: #4f46e5; background: #f5f3ff; border-style: solid; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-800">

    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-indigo-700 p-6 shadow-md">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <h1 class="text-2xl font-bold text-white tracking-tight">監視器巡檢報告系統</h1>
                <div class="flex items-center bg-indigo-600 rounded-lg px-4 py-2 border border-indigo-400">
                    <label class="text-indigo-100 mr-2 whitespace-nowrap font-medium text-sm">巡檢據點：</label>
                    <input type="text" id="siteName" placeholder="例如：台北辦公室" 
                        class="bg-transparent text-white placeholder-indigo-300 border-none focus:ring-0 outline-none w-full text-sm">
                </div>
            </div>
        </div>

        <div class="p-6">
            <!-- 填寫區域 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8 bg-slate-50 p-6 rounded-xl border border-slate-200">
                
                <!-- 1. 資訊 -->
                <div class="space-y-4">
                    <h3 class="font-bold text-slate-700 flex items-center text-sm uppercase tracking-wider">
                        <span class="bg-indigo-600 text-white w-5 h-5 rounded-full inline-flex items-center justify-center mr-2 text-[10px]">1</span>
                        基本資訊 & 註記
                    </h3>
                    <input type="text" id="camId" placeholder="監視器編號 / 位置" 
                        class="w-full px-4 py-2.5 rounded-lg border-slate-300 border focus:ring-2 focus:ring-indigo-500 outline-none text-sm shadow-sm">
                    <textarea id="camNote" rows="3" placeholder="註記說明 (選填)..." 
                        class="w-full px-4 py-2.5 rounded-lg border-slate-300 border focus:ring-2 focus:ring-indigo-500 outline-none text-sm shadow-sm"></textarea>
                </div>

                <!-- 2. 截圖 (修正點擊問題) -->
                <div class="space-y-2">
                    <h3 class="font-bold text-slate-700 flex items-center text-sm uppercase tracking-wider">
                        <span class="bg-indigo-600 text-white w-5 h-5 rounded-full inline-flex items-center justify-center mr-2 text-[10px]">2</span>
                        畫面截圖
                    </h3>
                    <!-- 隱藏的 File Input -->
                    <input type="file" id="fileInput" class="hidden" accept="image/*">
                    <!-- 點擊區域 -->
                    <div id="drop-zone" class="drop-area rounded-xl flex flex-col justify-center items-center p-4">
                        <div id="upload-prompt" class="text-center">
                            <svg class="w-10 h-10 text-slate-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <p class="text-slate-500 text-xs px-2">點擊選擇、拖放圖片 <br> 或 <span class="text-indigo-600 font-bold">Ctrl+V 貼上</span></p>
                        </div>
                        <div id="preview-container" class="hidden relative">
                            <img id="temp-preview" class="preview-img border border-slate-200 shadow-md">
                            <button id="btn-reset-img" class="absolute -top-3 -right-3 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg hover:bg-red-600 border-2 border-white">✕</button>
                        </div>
                    </div>
                </div>

                <!-- 3. 確認 -->
                <div class="space-y-4">
                    <h3 class="font-bold text-slate-700 flex items-center text-sm uppercase tracking-wider">
                        <span class="bg-indigo-600 text-white w-5 h-5 rounded-full inline-flex items-center justify-center mr-2 text-[10px]">3</span>
                        狀態確認
                    </h3>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center bg-white border border-slate-200 rounded-lg p-3 cursor-pointer hover:border-indigo-300 transition">
                            <input type="checkbox" id="checkImage" class="w-5 h-5 text-indigo-600 rounded">
                            <span class="ml-2 text-xs font-bold text-slate-600">畫面正常</span>
                        </label>
                        <label class="flex items-center bg-white border border-slate-200 rounded-lg p-3 cursor-pointer hover:border-indigo-300 transition">
                            <input type="checkbox" id="checkRecord" class="w-5 h-5 text-indigo-600 rounded">
                            <span class="ml-2 text-xs font-bold text-slate-600">錄影正常</span>
                        </label>
                    </div>
                    <button onclick="addEntry()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition transform active:scale-95 flex justify-center items-center">
                        新增此筆紀錄
                    </button>
                </div>
            </div>

            <!-- 清單 -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-100 text-slate-500 text-[11px] uppercase tracking-widest font-bold">
                        <tr>
                            <th class="p-4 border-b">監視器資訊</th>
                            <th class="p-4 border-b">截圖</th>
                            <th class="p-4 border-b text-center">畫面/錄影</th>
                            <th class="p-4 border-b">註記</th>
                            <th class="p-4 border-b text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm divide-y divide-slate-100">
                        <!-- 資料插入處 -->
                    </tbody>
                </table>
                <div id="empty-msg" class="p-10 text-center text-slate-400 text-sm">
                    目前尚無紀錄，請由上方新增資料。
                </div>
            </div>

            <!-- 底部動作 -->
            <div class="mt-8 flex flex-col md:flex-row gap-4 justify-between items-center border-t border-slate-100 pt-6">
                <div class="text-slate-500 text-sm font-medium">
                    據點：<span id="display-site" class="text-indigo-600">未設定</span> | 
                    紀錄筆數：<span id="recordCount" class="text-indigo-600">0</span>
                </div>
                <div class="flex gap-4">
                    <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 px-6 rounded-xl font-bold shadow-md transition flex items-center text-sm">
                        匯出 EXCEL (含圖片)
                    </button>
                    <button onclick="exportPDF()" class="bg-rose-600 hover:bg-rose-700 text-white py-2.5 px-6 rounded-xl font-bold shadow-md transition flex items-center text-sm">
                        匯出 PDF 報告
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = [];
        let currentImageData = null;

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('drop-zone');
        const tempPreview = document.getElementById('temp-preview');
        const previewContainer = document.getElementById('preview-container');
        const uploadPrompt = document.getElementById('upload-prompt');
        const btnResetImg = document.getElementById('btn-reset-img');
        const siteInput = document.getElementById('siteName');

        // 更新據點名稱顯示
        siteInput.addEventListener('input', (e) => {
            document.getElementById('display-site').innerText = e.target.value || "未設定";
        });

        // --- 核心修正：點擊上傳邏輯 ---
        dropZone.addEventListener('click', (e) => {
            // 如果點擊的是刪除按鈕，不觸發上傳
            if (e.target.closest('#btn-reset-img')) return;
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleImage(e.target.files[0]);
            }
        });

        // 拖放圖片
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('active'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            if (e.dataTransfer.files.length > 0) {
                handleImage(e.dataTransfer.files[0]);
            }
        });

        // 貼上圖片 (Ctrl + V)
        document.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    handleImage(items[i].getAsFile());
                }
            }
        });

        function handleImage(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImageData = e.target.result;
                tempPreview.src = currentImageData;
                previewContainer.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        // 清除當前截圖
        btnResetImg.addEventListener('click', (e) => {
            e.stopPropagation();
            currentImageData = null;
            previewContainer.classList.add('hidden');
            uploadPrompt.classList.remove('hidden');
            fileInput.value = '';
        });

        // --- 資料管理 ---
        function addEntry() {
            const camId = document.getElementById('camId').value.trim();
            const note = document.getElementById('camNote').value.trim();
            
            if (!camId) return alert("請輸入監視器編號或位置");
            if (!currentImageData) return alert("請貼上或選擇截圖畫面");

            const record = {
                id: Date.now(),
                camId: camId,
                note: note || "無",
                time: new Date().toLocaleString(),
                image: currentImageData,
                isImageOk: document.getElementById('checkImage').checked,
                isRecordOk: document.getElementById('checkRecord').checked
            };

            records.push(record);
            renderTable();
            
            // 重置輸入區
            document.getElementById('camId').value = "";
            document.getElementById('camNote').value = "";
            document.getElementById('checkImage').checked = false;
            document.getElementById('checkRecord').checked = false;
            btnResetImg.click(); // 調用清除圖片按鈕
        }

        function deleteEntry(id) {
            if(!confirm("確定要刪除此筆紀錄？")) return;
            records = records.filter(r => r.id !== id);
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const emptyMsg = document.getElementById('empty-msg');
            document.getElementById('recordCount').innerText = records.length;
            
            if (records.length === 0) {
                emptyMsg.classList.remove('hidden');
                tbody.innerHTML = '';
                return;
            }
            
            emptyMsg.classList.add('hidden');
            tbody.innerHTML = records.map(r => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-4">
                        <div class="font-bold text-slate-700">${r.camId}</div>
                        <div class="text-[10px] text-slate-400 mt-1">${r.time}</div>
                    </td>
                    <td class="p-4"><img src="${r.image}" class="preview-img border shadow-sm"></td>
                    <td class="p-4 text-center">
                        <div class="flex flex-col gap-1 items-center">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${r.isImageOk?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">畫面: ${r.isImageOk?'OK':'NG'}</span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${r.isRecordOk?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">錄影: ${r.isRecordOk?'OK':'NG'}</span>
                        </div>
                    </td>
                    <td class="p-4 text-slate-600 text-xs max-w-[200px] break-words">${r.note}</td>
                    <td class="p-4 text-center">
                        <button onclick="deleteEntry(${r.id})" class="text-rose-500 hover:text-rose-700 font-bold text-xs uppercase tracking-tighter">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        // --- 匯出 Excel (含圖片) ---
        async function exportExcel() {
            if (records.length === 0) return alert("沒有紀錄可以匯出");
            const siteName = siteInput.value || "未命名據點";

            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('巡檢報告');

            // 設定欄位
            worksheet.columns = [
                { header: '監視器位置', key: 'camId', width: 25 },
                { header: '巡檢時間', key: 'time', width: 22 },
                { header: '畫面截圖', key: 'image', width: 35 },
                { header: '畫面顯示', key: 'isImageOk', width: 12 },
                { header: '錄影功能', key: 'isRecordOk', width: 12 },
                { header: '備註/註記', key: 'note', width: 40 }
            ];

            // 填入資料
            for (let i = 0; i < records.length; i++) {
                const r = records[i];
                const row = worksheet.addRow({
                    camId: r.camId,
                    time: r.time,
                    isImageOk: r.isImageOk ? '正常' : '異常',
                    isRecordOk: r.isRecordOk ? '正常' : '異常',
                    note: r.note
                });

                row.height = 95; // 高度配合圖片
                row.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };

                // 處理圖片
                const imageId = workbook.addImage({
                    base64: r.image,
                    extension: 'png',
                });

                worksheet.addImage(imageId, {
                    tl: { col: 2, row: i + 1 }, 
                    ext: { width: 240, height: 120 }
                });
            }

            // 表頭樣式
            worksheet.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
            worksheet.getRow(1).fill = { type: 'pattern', pattern:'solid', fgColor:{argb:'FF4F46E5'} };

            const buffer = await workbook.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), `監視器巡檢_${siteName}.xlsx`);
        }

        // --- 匯出 PDF ---
        function exportPDF() {
            if (records.length === 0) return alert("沒有紀錄可以匯出");
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const siteName = siteInput.value || "未命名據點";

            doc.setFontSize(20);
            doc.text(`監視器巡檢報告: ${siteName}`, 14, 15);
            doc.setFontSize(10);
            doc.text(`日期: ${new Date().toLocaleString()}`, 14, 22);

            let y = 30;
            records.forEach((r, idx) => {
                if (y > 240) { doc.addPage(); y = 20; }
                doc.setDrawColor(230);
                doc.line(10, y, 200, y);
                y += 10;
                doc.setFontSize(12);
                doc.text(`${idx+1}. 位置: ${r.camId}`, 14, y);
                doc.setFontSize(9);
                doc.text(`時間: ${r.time}`, 14, y+6);
                doc.text(`狀態: 畫面 ${r.isImageOk?'正常':'異常'} / 錄影 ${r.isRecordOk?'正常':'異常'}`, 14, y+12);
                doc.text(`註記: ${r.note}`, 14, y+18);
                try {
                    doc.addImage(r.image, 'JPEG', 125, y-5, 65, 45);
                } catch(e) {}
                y += 50;
            });

            doc.save(`巡檢報告_${siteName}.pdf`);
        }
    </script>
</body>
</html>
