<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監視器巡檢系統 V6 - 穩定匯入版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ExcelJS 處理 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <!-- FileSaver 處理下載 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- jsPDF 處理 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .preview-img { max-width: 150px; max-height: 100px; object-fit: cover; border-radius: 4px; }
        .drop-area { border: 2px dashed #cbd5e1; transition: all 0.2s; height: 160px; cursor: pointer; background: white; }
        .drop-area:hover { border-color: #4f46e5; background: #f8fafc; }
        .drop-area.active { border-color: #4f46e5; background: #f5f3ff; border-style: solid; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; color: white; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-800 font-sans">

    <!-- 讀取中遮罩 -->
    <div id="loading" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent mb-4"></div>
        <p class="font-bold">正在讀取檔案與圖片，請稍後...</p>
    </div>

    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- Header -->
        <div class="bg-indigo-700 p-6 shadow-md">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex flex-wrap items-center gap-3">
                    <h1 class="text-2xl font-bold text-white tracking-tight mr-4">監視器巡檢系統</h1>
                    <!-- 匯入按鈕 -->
                    <label class="bg-amber-500 hover:bg-amber-400 text-white text-xs font-bold py-2 px-4 rounded-lg cursor-pointer transition shadow-lg flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        匯入舊 Excel 修改
                        <input type="file" id="importExcel" class="hidden" accept=".xlsx">
                    </label>
                </div>
                <div class="flex items-center bg-indigo-600 rounded-lg px-4 py-2 border border-indigo-400">
                    <label class="text-indigo-100 mr-2 whitespace-nowrap font-medium text-sm">巡檢據點：</label>
                    <input type="text" id="siteName" placeholder="例如：台北總部" 
                        class="bg-transparent text-white placeholder-indigo-300 border-none focus:ring-0 outline-none w-full text-sm font-bold">
                </div>
            </div>
        </div>

        <div class="p-6">
            <!-- 填寫區域 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8 bg-slate-100 p-6 rounded-xl border border-slate-200">
                
                <!-- 1. 資訊 -->
                <div class="space-y-4">
                    <h3 class="font-bold text-indigo-700 flex items-center text-sm uppercase">
                        <span class="bg-indigo-700 text-white w-5 h-5 rounded-full inline-flex items-center justify-center mr-2 text-[10px]">1</span>
                        基本資訊
                    </h3>
                    <input type="text" id="camId" placeholder="監視器編號 / 位置" 
                        class="w-full px-4 py-2.5 rounded-lg border-slate-300 border focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    <textarea id="camNote" rows="2" placeholder="註記說明 (選填)..." 
                        class="w-full px-4 py-2.5 rounded-lg border-slate-300 border focus:ring-2 focus:ring-indigo-500 outline-none text-sm"></textarea>
                </div>

                <!-- 2. 截圖 -->
                <div class="space-y-2">
                    <h3 class="font-bold text-indigo-700 flex items-center text-sm uppercase">
                        <span class="bg-indigo-700 text-white w-5 h-5 rounded-full inline-flex items-center justify-center mr-2 text-[10px]">2</span>
                        畫面截圖
                    </h3>
                    <input type="file" id="fileInput" class="hidden" accept="image/*">
                    <div id="drop-zone" class="drop-area rounded-xl flex flex-col justify-center items-center p-4">
                        <div id="upload-prompt" class="text-center">
                            <p class="text-slate-500 text-xs font-medium">點擊選擇、拖放圖片 <br> 或 <span class="text-indigo-600 font-bold underline">Ctrl+V 貼上</span></p>
                        </div>
                        <div id="preview-container" class="hidden relative">
                            <img id="temp-preview" class="preview-img border shadow-sm bg-white">
                            <button id="btn-reset-img" class="absolute -top-3 -right-3 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg hover:bg-red-600 border-2 border-white">✕</button>
                        </div>
                    </div>
                </div>

                <!-- 3. 確認 -->
                <div class="space-y-4">
                    <h3 class="font-bold text-indigo-700 flex items-center text-sm uppercase">
                        <span class="bg-indigo-700 text-white w-5 h-5 rounded-full inline-flex items-center justify-center mr-2 text-[10px]">3</span>
                        狀態確認
                    </h3>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center bg-white border border-slate-200 rounded-lg p-3 cursor-pointer hover:border-indigo-300 transition">
                            <input type="checkbox" id="checkImage" class="w-5 h-5 text-indigo-600 rounded">
                            <span class="ml-2 text-xs font-bold text-slate-600">畫面正常</span>
                        </label>
                        <label class="flex items-center bg-white border border-slate-200 rounded-lg p-3 cursor-pointer hover:border-indigo-300 transition">
                            <input type="checkbox" id="checkRecord" class="w-5 h-5 text-indigo-600 rounded">
                            <span class="ml-2 text-xs font-bold text-slate-600">錄影正常</span>
                        </label>
                    </div>
                    <button onclick="addEntry()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition transform active:scale-95">
                        新增此筆紀錄
                    </button>
                </div>
            </div>

            <!-- 清單表格 -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-widest font-bold">
                        <tr>
                            <th class="p-4 border-b">位置/時間</th>
                            <th class="p-4 border-b">畫面截圖</th>
                            <th class="p-4 border-b text-center">狀態</th>
                            <th class="p-4 border-b">註記說明</th>
                            <th class="p-4 border-b text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm divide-y divide-slate-100">
                        <!-- 動態內容 -->
                    </tbody>
                </table>
                <div id="empty-msg" class="p-12 text-center text-slate-400 text-sm italic">
                    目前尚無巡檢紀錄，請由上方填寫或匯入檔案。
                </div>
            </div>

            <!-- 底部按鈕區 -->
            <div class="mt-8 flex flex-col md:flex-row gap-4 justify-between items-center border-t border-slate-100 pt-6">
                <p class="text-slate-500 text-sm">目前紀錄筆數：<span id="recordCount" class="font-bold text-indigo-600">0</span></p>
                <div class="flex flex-wrap gap-4">
                    <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 px-6 rounded-xl font-bold shadow-md transition flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        匯出 Excel (.xlsx)
                    </button>
                    <button onclick="exportPDF()" class="bg-rose-600 hover:bg-rose-700 text-white py-2.5 px-6 rounded-xl font-bold shadow-md transition flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                        匯出 PDF 報告 (.pdf)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = [];
        let currentImageData = null;

        // UI 綁定
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('drop-zone');
        const tempPreview = document.getElementById('temp-preview');
        const previewContainer = document.getElementById('preview-container');
        const uploadPrompt = document.getElementById('upload-prompt');
        const btnResetImg = document.getElementById('btn-reset-img');
        const siteInput = document.getElementById('siteName');
        const importExcelInput = document.getElementById('importExcel');
        const loading = document.getElementById('loading');

        // --- 核心：修正後的 Excel 匯入 ---
        importExcelInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loading.style.display = 'flex';
            
            try {
                const workbook = new ExcelJS.Workbook();
                const arrayBuffer = await file.arrayBuffer();
                await workbook.xlsx.load(arrayBuffer);
                const worksheet = workbook.getWorksheets()[0];
                
                const newRecords = [];
                const images = worksheet.getImages();

                // 建立圖片對照表 [rowNumber] -> imageId
                const imgMap = {};
                images.forEach(img => {
                    imgMap[img.range.tl.nativeRow] = img.imageId;
                });

                worksheet.eachRow((row, rowNumber) => {
                    if (rowNumber === 1) return; // 跳過標題列

                    const camId = row.getCell(1).value;
                    const time = row.getCell(2).value;
                    const isImageOk = row.getCell(4).value === '正常';
                    const isRecordOk = row.getCell(5).value === '正常';
                    const note = row.getCell(6).value || "";

                    // 取得圖片
                    let base64Image = "";
                    const imgId = imgMap[rowNumber - 1];
                    if (imgId !== undefined) {
                        const img = workbook.getImage(imgId);
                        // 將 Buffer 轉為 Base64
                        const binary = Array.from(new Uint8Array(img.buffer)).map(b => String.fromCharCode(b)).join('');
                        base64Image = `data:image/${img.extension};base64,${btoa(binary)}`;
                    }

                    if (camId) {
                        newRecords.push({
                            id: Date.now() + rowNumber,
                            camId: camId,
                            time: time || new Date().toLocaleString(),
                            image: base64Image,
                            isImageOk: isImageOk,
                            isRecordOk: isRecordOk,
                            note: note
                        });
                    }
                });

                if (newRecords.length > 0) {
                    records = [...records, ...newRecords];
                    renderTable();
                    alert(`成功匯入 ${newRecords.length} 筆紀錄`);
                } else {
                    alert("找不到有效的紀錄，請確認檔案格式是否正確。");
                }

            } catch (err) {
                console.error("匯入錯誤:", err);
                alert("檔案讀取失敗，請確保此為本系統匯出的 Excel 檔案。");
            } finally {
                loading.style.display = 'none';
                importExcelInput.value = '';
            }
        });

        // --- 基礎：圖片處理 ---
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => { if(e.target.files[0]) handleImage(e.target.files[0]); };
        
        document.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (const item of items) {
                if (item.type.indexOf("image") !== -1) handleImage(item.getAsFile());
            }
        });

        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImageData = e.target.result;
                tempPreview.src = currentImageData;
                previewContainer.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        btnResetImg.onclick = (e) => {
            e.stopPropagation();
            currentImageData = null;
            previewContainer.classList.add('hidden');
            uploadPrompt.classList.remove('hidden');
            fileInput.value = '';
        };

        // --- 資料管理 ---
        function addEntry() {
            const camId = document.getElementById('camId').value.trim();
            if (!camId) return alert("請輸入監視器編號或位置");
            if (!currentImageData) return alert("請上傳或貼上截圖");

            records.push({
                id: Date.now(),
                camId: camId,
                note: document.getElementById('camNote').value,
                time: new Date().toLocaleString(),
                image: currentImageData,
                isImageOk: document.getElementById('checkImage').checked,
                isRecordOk: document.getElementById('checkRecord').checked
            });
            renderTable();
            // Reset fields
            document.getElementById('camId').value = "";
            document.getElementById('camNote').value = "";
            btnResetImg.click();
        }

        function deleteEntry(id) {
            if(!confirm("確定刪除此紀錄？")) return;
            records = records.filter(r => r.id !== id);
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const emptyMsg = document.getElementById('empty-msg');
            document.getElementById('recordCount').innerText = records.length;

            if (records.length === 0) {
                emptyMsg.classList.remove('hidden');
                tbody.innerHTML = '';
                return;
            }

            emptyMsg.classList.add('hidden');
            tbody.innerHTML = records.map(r => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-4 border-b">
                        <div class="font-bold text-slate-700 text-sm">${r.camId}</div>
                        <div class="text-[10px] text-slate-400 mt-1">${r.time}</div>
                    </td>
                    <td class="p-4 border-b">
                        <img src="${r.image}" class="preview-img border shadow-sm bg-white">
                    </td>
                    <td class="p-4 border-b text-center">
                        <div class="flex flex-col gap-1 items-center">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${r.isImageOk?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">畫面: ${r.isImageOk?'正常':'異常'}</span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${r.isRecordOk?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">錄影: ${r.isRecordOk?'正常':'異常'}</span>
                        </div>
                    </td>
                    <td class="p-4 border-b text-slate-600 text-xs">${r.note || '無'}</td>
                    <td class="p-4 border-b text-center">
                        <button onclick="deleteEntry(${r.id})" class="text-rose-500 hover:text-rose-700 text-xs font-bold uppercase">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        // --- 匯出功能 (Excel) ---
        async function exportExcel() {
            if (records.length === 0) return alert("目前沒有紀錄可以匯出");
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('巡檢報告');

            worksheet.columns = [
                { header: '位置/編號', key: 'camId', width: 25 },
                { header: '巡檢時間', key: 'time', width: 22 },
                { header: '截圖預覽', key: 'image', width: 35 },
                { header: '畫面狀態', key: 'isImageOk', width: 12 },
                { header: '錄影狀態', key: 'isRecordOk', width: 12 },
                { header: '備註', key: 'note', width: 40 }
            ];

            records.forEach((r, i) => {
                const row = worksheet.addRow({
                    camId: r.camId,
                    time: r.time,
                    isImageOk: r.isImageOk ? '正常' : '異常',
                    isRecordOk: r.isRecordOk ? '正常' : '異常',
                    note: r.note
                });
                row.height = 95;
                row.alignment = { vertical: 'middle', wrapText: true };

                const imageId = workbook.addImage({ base64: r.image, extension: 'png' });
                worksheet.addImage(imageId, {
                    tl: { col: 2, row: i + 1 },
                    ext: { width: 240, height: 120 }
                });
            });

            worksheet.getRow(1).font = { bold: true };
            worksheet.getRow(1).fill = { type: 'pattern', pattern:'solid', fgColor:{argb:'FFE2E8F0'} };

            const buffer = await workbook.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), `巡檢報告_${siteInput.value || '未命名'}.xlsx`);
        }

        // --- 匯出功能 (PDF) ---
        function exportPDF() {
            if (records.length === 0) return alert("目前沒有紀錄可以匯出");
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const siteName = siteInput.value || "未命名據點";

            doc.setFontSize(20);
            doc.text(`監視器巡檢報告: ${siteName}`, 14, 18);
            doc.setFontSize(10);
            doc.text(`產出時間: ${new Date().toLocaleString()}`, 14, 25);

            let y = 35;
            records.forEach((r, i) => {
                if (y > 240) { doc.addPage(); y = 20; }

                doc.setDrawColor(220);
                doc.line(10, y, 200, y);
                y += 10;

                doc.setFontSize(12);
                doc.text(`${i+1}. 位置: ${r.camId}`, 14, y);
                doc.setFontSize(9);
                doc.text(`時間: ${r.time}`, 14, y + 6);
                doc.text(`狀態: 畫面 ${r.isImageOk?'正常':'異常'} / 錄影 ${r.isRecordOk?'正常':'異常'}`, 14, y + 12);
                doc.text(`備註: ${r.note || '無'}`, 14, y + 18);

                try {
                    doc.addImage(r.image, 'JPEG', 125, y - 5, 65, 45);
                } catch(e) {
                    console.error("PDF 圖片插入失敗", e);
                }
                y += 55;
            });

            doc.save(`巡檢報告_${siteName}.pdf`);
        }
    </script>
</body>
</html>
