<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監視器巡檢系統 V13 - Chrome 終極穩定版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .preview-img { max-width: 140px; max-height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid #dee2e6; }
        .drop-area { border: 2px dashed #cbd5e1; height: 160px; cursor: pointer; transition: 0.3s; background: #fff; }
        .drop-area:hover { border-color: #4f46e5; background: #f8fafc; }
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: #fff; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-800">

    <!-- 讀取中遮罩 -->
    <div id="loading" class="loading-overlay">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-indigo-400 border-t-transparent mb-4"></div>
        <p class="text-lg font-bold" id="loadingText">系統處理中，請稍候...</p>
    </div>

    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
        <!-- 頂部標題與匯入 -->
        <div class="bg-indigo-700 p-6 shadow-lg flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-black text-white tracking-tight">CCTV 巡檢報告系統</h1>
                <label class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2.5 px-5 rounded-lg cursor-pointer transition shadow-md">
                    📂 匯入舊 Excel
                    <input type="file" id="importExcel" class="hidden" accept=".xlsx">
                </label>
            </div>
            <div class="bg-indigo-800/50 rounded-xl px-4 py-2 border border-indigo-400/50 flex items-center w-full md:w-64">
                <span class="text-indigo-200 mr-2 text-sm font-bold">據點:</span>
                <input type="text" id="siteName" placeholder="輸入據點名稱" class="bg-transparent text-white placeholder-indigo-400 border-none focus:ring-0 outline-none w-full text-sm font-bold">
            </div>
        </div>

        <div class="p-6">
            <!-- 編輯輸入區 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8 bg-slate-50 p-6 rounded-2xl border border-slate-200 shadow-inner">
                <div class="space-y-4">
                    <h3 class="text-indigo-600 font-bold text-xs uppercase tracking-widest">1. 位置與備註</h3>
                    <input type="text" id="camId" placeholder="監視器位置 (例如: A-01)" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    <textarea id="camNote" rows="2" placeholder="輸入巡檢備註..." class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"></textarea>
                </div>

                <div class="space-y-2">
                    <h3 class="text-indigo-600 font-bold text-xs uppercase tracking-widest">2. 畫面截圖</h3>
                    <input type="file" id="fileInput" class="hidden" accept="image/*">
                    <div id="drop-zone" class="drop-area rounded-2xl flex flex-col justify-center items-center p-4">
                        <div id="upload-prompt" class="text-center text-slate-400">
                            <p class="text-xs">點擊選擇圖片 或</p>
                            <p class="text-indigo-600 font-bold underline cursor-pointer">Ctrl + V 直接貼上</p>
                        </div>
                        <div id="preview-container" class="hidden relative">
                            <img id="temp-preview" class="preview-img shadow-lg border-2 border-white">
                            <button id="btn-reset-img" class="absolute -top-3 -right-3 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-md">✕</button>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <h3 class="text-indigo-600 font-bold text-xs uppercase tracking-widest">3. 確認狀態</h3>
                    <div class="flex flex-col gap-2">
                        <label class="flex items-center bg-white border border-slate-200 rounded-xl p-3 cursor-pointer hover:bg-white shadow-sm transition">
                            <input type="checkbox" id="checkImage" class="w-5 h-5 text-indigo-600 rounded">
                            <span class="ml-3 font-bold text-slate-700 text-sm">畫面顯示正常</span>
                        </label>
                        <label class="flex items-center bg-white border border-slate-200 rounded-xl p-3 cursor-pointer hover:bg-white shadow-sm transition">
                            <input type="checkbox" id="checkRecord" class="w-5 h-5 text-indigo-600 rounded">
                            <span class="ml-3 font-bold text-slate-700 text-sm">錄影紀錄正常</span>
                        </label>
                    </div>
                    <button onclick="addEntry()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95">
                        新增至清單
                    </button>
                </div>
            </div>

            <!-- 清單表格 -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-400 text-[10px] uppercase font-bold tracking-widest">
                        <tr>
                            <th class="p-5 border-b">位置 / 時間</th>
                            <th class="p-5 border-b">截圖預覽</th>
                            <th class="p-5 border-b text-center">檢測狀態</th>
                            <th class="p-5 border-b">備註說明</th>
                            <th class="p-5 border-b text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100 text-sm"></tbody>
                </table>
                <div id="empty-msg" class="p-20 text-center text-slate-300 text-sm italic font-medium">目前尚無巡檢資料</div>
            </div>

            <!-- 底部匯出區 -->
            <div class="mt-8 flex flex-col md:flex-row gap-4 justify-between items-center border-t border-slate-100 pt-8">
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest italic">目前筆數: <span id="recordCount" class="text-indigo-600 font-black">0</span></p>
                <div class="flex flex-wrap gap-4">
                    <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-8 rounded-xl font-bold shadow-lg transition-all text-sm">匯出 Excel</button>
                    <button onclick="exportPDF()" class="bg-rose-600 hover:bg-rose-700 text-white py-3 px-8 rounded-xl font-bold shadow-lg transition-all text-sm">匯出 PDF 報告</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = [];
        let currentImageData = null;

        // UI 連接
        const ui = {
            loading: document.getElementById('loading'),
            loadingText: document.getElementById('loadingText'),
            table: document.getElementById('tableBody'),
            empty: document.getElementById('empty-msg'),
            count: document.getElementById('recordCount'),
            site: document.getElementById('siteName'),
            camId: document.getElementById('camId'),
            camNote: document.getElementById('camNote'),
            checkImage: document.getElementById('checkImage'),
            checkRecord: document.getElementById('checkRecord'),
            preview: document.getElementById('temp-preview'),
            previewContainer: document.getElementById('preview-container'),
            prompt: document.getElementById('upload-prompt'),
            fileInput: document.getElementById('fileInput')
        };

        // --- 穩定版圖片轉碼 (解決 Chrome 崩潰) ---
        function safeBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            const chunkSize = 0x8000; // 32KB chunk
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return window.btoa(binary);
        }

        // --- 核心匯入邏輯 (V13) ---
        document.getElementById('importExcel').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            ui.loading.style.display = 'flex';
            ui.loadingText.innerText = "正在解讀檔案...";

            try {
                const workbook = new ExcelJS.Workbook();
                const arrayBuffer = await file.arrayBuffer();
                await workbook.xlsx.load(arrayBuffer);
                const worksheet = workbook.worksheets[0];

                if (!worksheet) throw new Error("無效的工作表");

                const newRecords = [];
                const images = worksheet.getImages();
                const imgMap = {};
                images.forEach(img => { imgMap[img.range.tl.nativeRow] = img.imageId; });

                worksheet.eachRow((row, rowNumber) => {
                    if (rowNumber === 1) return; // Skip Header

                    const camId = row.getCell(1).text || row.getCell(1).value;
                    if (!camId) return;

                    let base64Image = "";
                    const imgId = imgMap[rowNumber - 1];
                    if (imgId !== undefined) {
                        const img = workbook.getImage(imgId);
                        const base64 = safeBufferToBase64(img.buffer);
                        base64Image = `data:image/${img.extension};base64,${base64}`;
                    }

                    newRecords.push({
                        id: Date.now() + rowNumber + Math.random(),
                        camId: String(camId),
                        time: row.getCell(2).text || new Date().toLocaleString(),
                        image: base64Image,
                        isImageOk: String(row.getCell(4).text).includes("正常"),
                        isRecordOk: String(row.getCell(5).text).includes("正常"),
                        note: row.getCell(6).text || ""
                    });
                });

                if (newRecords.length > 0) {
                    records = [...records, ...newRecords];
                    renderTable();
                    alert(`成功讀取 ${newRecords.length} 筆資料`);
                }
            } catch (err) {
                console.error(err);
                alert("匯入失敗：檔案結構不符或過大。");
            } finally {
                ui.loading.style.display = 'none';
                e.target.value = '';
            }
        });

        // --- 圖片處理與新增 ---
        document.getElementById('drop-zone').onclick = () => ui.fileInput.click();
        ui.fileInput.onchange = (e) => handleFile(e.target.files[0]);
        document.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (const item of items) { if (item.type.indexOf("image") !== -1) handleFile(item.getAsFile()); }
        });

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImageData = e.target.result;
                ui.preview.src = currentImageData;
                ui.previewContainer.classList.remove('hidden');
                ui.prompt.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('btn-reset-img').onclick = (e) => {
            e.stopPropagation();
            currentImageData = null;
            ui.previewContainer.classList.add('hidden');
            ui.prompt.classList.remove('hidden');
            ui.fileInput.value = '';
        };

        function addEntry() {
            const camId = ui.camId.value.trim();
            if (!camId || !currentImageData) return alert("請輸入位置資訊並放入截圖");

            records.push({
                id: Date.now(),
                camId: camId,
                note: ui.camNote.value.trim(),
                time: new Date().toLocaleString(),
                image: currentImageData,
                isImageOk: ui.checkImage.checked,
                isRecordOk: ui.checkRecord.checked
            });
            renderTable();
            // Reset
            ui.camId.value = "";
            ui.camNote.value = "";
            document.getElementById('btn-reset-img').click();
        }

        function renderTable() {
            ui.count.innerText = records.length;
            if (records.length === 0) { ui.empty.classList.remove('hidden'); ui.table.innerHTML = ''; return; }
            ui.empty.classList.add('hidden');
            ui.table.innerHTML = records.map(r => `
                <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                    <td class="p-5 font-black text-slate-700">${r.camId}<br><span class="text-[10px] text-slate-400 font-normal tracking-tighter">${r.time}</span></td>
                    <td class="p-5"><img src="${r.image}" class="preview-img shadow-md border-2 border-white"></td>
                    <td class="p-5 text-center text-[10px] font-bold">
                        <div class="${r.isImageOk?'text-green-600':'text-red-600'}">畫面: ${r.isImageOk?'OK':'NG'}</div>
                        <div class="${r.isRecordOk?'text-green-600':'text-red-600'}">錄影: ${r.isRecordOk?'OK':'NG'}</div>
                    </td>
                    <td class="p-5 text-xs text-slate-500 italic max-w-[150px] break-words">${r.note || '無'}</td>
                    <td class="p-5 text-center"><button onclick="deleteEntry(${r.id})" class="text-rose-500 hover:font-black transition-all">刪除</button></td>
                </tr>
            `).join('');
        }

        function deleteEntry(id) { if (confirm("確定刪除此項紀錄？")) { records = records.filter(r => r.id !== id); renderTable(); } }

        // --- 匯出功能 ---
        async function exportExcel() {
            if (records.length === 0) return alert("目前尚無資料");
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('巡檢紀錄');
            worksheet.columns = [
                { header: '位置', key: 'camId', width: 25 },
                { header: '時間', key: 'time', width: 25 },
                { header: '截圖', key: 'image', width: 35 },
                { header: '畫面', key: 'isImageOk', width: 12 },
                { header: '錄影', key: 'isRecordOk', width: 12 },
                { header: '註記', key: 'note', width: 40 }
            ];
            records.forEach((r, i) => {
                const row = worksheet.addRow({
                    camId: r.camId, time: r.time,
                    isImageOk: r.isImageOk ? '正常' : '異常',
                    isRecordOk: r.isRecordOk ? '正常' : '異常',
                    note: r.note
                });
                row.height = 95;
                if (r.image) {
                    const imageId = workbook.addImage({ base64: r.image, extension: 'png' });
                    worksheet.addImage(imageId, { tl: { col: 2, row: i + 1 }, ext: { width: 240, height: 120 } });
                }
            });
            const buffer = await workbook.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), `巡檢報告_${ui.site.value || '未命名'}.xlsx`);
        }

        function exportPDF() {
            if (records.length === 0) return alert("目前尚無資料");
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const name = ui.site.value || "未命名";
            doc.text(`CCTV 巡檢報告: ${name}`, 14, 15);
            let y = 30;
            records.forEach((r, i) => {
                if (y > 240) { doc.addPage(); y = 20; }
                doc.setDrawColor(230); doc.line(10, y, 200, y); y += 10;
                doc.setFontSize(12); doc.text(`${i+1}. 位置: ${r.camId}`, 14, y);
                doc.setFontSize(9);
                doc.text(`狀態: 畫面 ${r.isImageOk?'正常':'異常'} / 錄影 ${r.isRecordOk?'正常':'異常'} | 時間: ${r.time}`, 14, y+6);
                doc.text(`備註: ${r.note || '無'}`, 14, y+12);
                if(r.image) { try { doc.addImage(r.image, 'JPEG', 130, y-5, 60, 40); } catch(e) {} }
                y += 50;
            });
            doc.save(`巡檢報告_${name}.pdf`);
        }
    </script>
</body>
</html>
