<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監視器巡檢系統 V7 - 強效匯入版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .preview-img { max-width: 150px; max-height: 100px; object-fit: cover; border-radius: 4px; background: #f1f5f9; }
        .drop-area { border: 2px dashed #cbd5e1; transition: all 0.2s; height: 160px; cursor: pointer; background: white; }
        .drop-area:hover { border-color: #4f46e5; background: #f8fafc; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: white; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-800">

    <div id="loading" class="loading-overlay">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-indigo-500 border-t-transparent mb-4"></div>
        <p class="text-lg font-bold">正在讀取 Excel 紀錄與還原圖片...</p>
        <p class="text-sm text-slate-400 mt-2">請勿關閉視窗</p>
    </div>

    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-indigo-700 p-6 shadow-md">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex flex-wrap items-center gap-3">
                    <h1 class="text-2xl font-bold text-white tracking-tight mr-4">監視器巡檢系統</h1>
                    <label class="bg-amber-500 hover:bg-amber-400 text-white text-xs font-bold py-2 px-4 rounded-lg cursor-pointer transition shadow-lg flex items-center">
                        📂 匯入舊 Excel 修改
                        <input type="file" id="importExcel" class="hidden" accept=".xlsx">
                    </label>
                </div>
                <div class="flex items-center bg-indigo-600 rounded-lg px-4 py-2 border border-indigo-400">
                    <label class="text-indigo-100 mr-2 whitespace-nowrap font-medium text-sm">巡檢據點：</label>
                    <input type="text" id="siteName" placeholder="例如：台北分部" 
                        class="bg-transparent text-white placeholder-indigo-300 border-none focus:ring-0 outline-none w-full text-sm font-bold">
                </div>
            </div>
        </div>

        <div class="p-6">
            <!-- 輸入區 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8 bg-slate-100 p-6 rounded-xl border border-slate-200 shadow-inner">
                <div class="space-y-4">
                    <h3 class="font-bold text-indigo-700 text-sm flex items-center italic">1. 基本資訊</h3>
                    <input type="text" id="camId" placeholder="監視器編號 / 位置" class="w-full px-4 py-2.5 rounded-lg border-slate-300 border focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    <textarea id="camNote" rows="2" placeholder="註記說明 (選填)..." class="w-full px-4 py-2.5 rounded-lg border-slate-300 border focus:ring-2 focus:ring-indigo-500 outline-none text-sm"></textarea>
                </div>

                <div class="space-y-2">
                    <h3 class="font-bold text-indigo-700 text-sm flex items-center italic">2. 畫面截圖</h3>
                    <input type="file" id="fileInput" class="hidden" accept="image/*">
                    <div id="drop-zone" class="drop-area rounded-xl flex flex-col justify-center items-center p-4">
                        <div id="upload-prompt" class="text-center">
                            <p class="text-slate-400 text-xs font-medium">點擊上傳、拖放圖片 <br> 或 <span class="text-indigo-600 font-bold underline">Ctrl+V 貼上</span></p>
                        </div>
                        <div id="preview-container" class="hidden relative">
                            <img id="temp-preview" class="preview-img border shadow-md">
                            <button id="btn-reset-img" class="absolute -top-3 -right-3 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg border-2 border-white">✕</button>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <h3 class="font-bold text-indigo-700 text-sm flex items-center italic">3. 狀態確認</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center bg-white border border-slate-200 rounded-lg p-3 cursor-pointer hover:bg-white transition shadow-sm">
                            <input type="checkbox" id="checkImage" class="w-5 h-5 text-indigo-600 rounded">
                            <span class="ml-2 text-xs font-bold text-slate-600">畫面正常</span>
                        </label>
                        <label class="flex items-center bg-white border border-slate-200 rounded-lg p-3 cursor-pointer hover:bg-white transition shadow-sm">
                            <input type="checkbox" id="checkRecord" class="w-5 h-5 text-indigo-600 rounded">
                            <span class="ml-2 text-xs font-bold text-slate-600">錄影正常</span>
                        </label>
                    </div>
                    <button onclick="addEntry()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition transform active:scale-95">
                        新增此筆紀錄
                    </button>
                </div>
            </div>

            <!-- 清單表格 -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden min-h-[300px]">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-widest font-bold">
                        <tr>
                            <th class="p-4 border-b">位置/時間</th>
                            <th class="p-4 border-b">畫面截圖</th>
                            <th class="p-4 border-b text-center">狀態</th>
                            <th class="p-4 border-b">註記</th>
                            <th class="p-4 border-b text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm divide-y divide-slate-100"></tbody>
                </table>
                <div id="empty-msg" class="p-12 text-center text-slate-400 text-sm italic">目前尚無巡檢紀錄</div>
            </div>

            <!-- 底部按鈕 -->
            <div class="mt-8 flex flex-col md:flex-row gap-4 justify-between items-center border-t border-slate-100 pt-6">
                <p class="text-slate-500 text-sm">目前紀錄筆數：<span id="recordCount" class="font-bold text-indigo-600">0</span></p>
                <div class="flex flex-wrap gap-4">
                    <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 px-6 rounded-xl font-bold shadow-md transition flex items-center">
                        匯出 Excel (.xlsx)
                    </button>
                    <button onclick="exportPDF()" class="bg-rose-600 hover:bg-rose-700 text-white py-2.5 px-6 rounded-xl font-bold shadow-md transition flex items-center">
                        匯出 PDF 報告 (.pdf)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = [];
        let currentImageData = null;

        // 元素選取
        const importExcelInput = document.getElementById('importExcel');
        const loading = document.getElementById('loading');
        const tableBody = document.getElementById('tableBody');
        const emptyMsg = document.getElementById('empty-msg');
        const recordCountText = document.getElementById('recordCount');

        // --- 核心：強效 Excel 匯入 ---
        importExcelInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loading.style.display = 'flex';
            const workbook = new ExcelJS.Workbook();
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                await workbook.xlsx.load(arrayBuffer);
                const worksheet = workbook.getWorksheets()[0];
                
                if (!worksheet) throw new Error("找不到工作表");

                const newRecords = [];
                const images = worksheet.getImages();

                // 圖片映射：使用 tl.nativeRow (0-based) 對應資料列
                const imgMap = {};
                images.forEach(img => {
                    imgMap[img.range.tl.nativeRow] = img.imageId;
                });

                worksheet.eachRow((row, rowNumber) => {
                    if (rowNumber === 1) return; // 跳過標題

                    const camId = row.getCell(1).text;
                    const time = row.getCell(2).text;
                    const isImageOk = row.getCell(4).text === '正常';
                    const isRecordOk = row.getCell(5).text === '正常';
                    const note = row.getCell(6).text || "";

                    if (!camId) return;

                    let base64Image = "";
                    const imgId = imgMap[rowNumber - 1];
                    if (imgId !== undefined) {
                        try {
                            const imgData = workbook.getImage(imgId);
                            // 轉為 Base64 (修正後的邏輯)
                            const uint8 = new Uint8Array(imgData.buffer);
                            let binary = '';
                            for (let i = 0; i < uint8.length; i++) {
                                binary += String.fromCharCode(uint8[i]);
                            }
                            base64Image = `data:image/${imgData.extension};base64,${window.btoa(binary)}`;
                        } catch (imgErr) {
                            console.warn(`第 ${rowNumber} 行圖片還原失敗`, imgErr);
                        }
                    }

                    newRecords.push({
                        id: Date.now() + rowNumber,
                        camId: camId,
                        time: time,
                        image: base64Image,
                        isImageOk: isImageOk,
                        isRecordOk: isRecordOk,
                        note: note
                    });
                });

                if (newRecords.length > 0) {
                    records = [...records, ...newRecords];
                    renderTable();
                    alert(`匯入完成！成功還原 ${newRecords.length} 筆紀錄。`);
                } else {
                    alert("檔案格式不符，請確認是本系統匯出的 Excel。");
                }
            } catch (err) {
                console.error("Excel 匯入失敗:", err);
                alert("檔案讀取失敗！請確保這是本系統匯出的 Excel 檔案且未損毀。");
            } finally {
                loading.style.display = 'none';
                importExcelInput.value = '';
            }
        });

        // --- 基礎：圖片處裡 ---
        document.getElementById('drop-zone').onclick = () => document.getElementById
